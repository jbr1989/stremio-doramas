name: Ejecución Automática con Jules

on:
  # Se activa automáticamente al abrir o actualizar un Issue en el repositorio
  issues:
    types: [opened, edited]

permissions:
  contents: write    # Permite a Jules crear ramas y código
  issues: write      # Permite a Jules leer y responder en el issue
  pull-requests: write # Permite a Jules abrir el PR con la solución

jobs:
  invocar-jules:
    # Solo se ejecuta si el Issue incluye la etiqueta 'jules'
    if: contains(github.event.issue.labels.*.name, 'jules')
    runs-on: ubuntu-latest

    steps:
      - name: Invocar al Agente Jules
        uses: google-labs-code/jules-invoke@v1
        with:
          prompt: ${{ github.event.issue.body }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
